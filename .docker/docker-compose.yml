name: powerdownload

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: powerdownload_web
    ports:
      - "8092:80"
    volumes:
      - ../:/var/www/html
      - ../logs:/var/www/html/logs
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      # Zugangsdaten für PowerDownload (Vorrang vor pdl-inc/pdl_config.local.php)
      - PDL_DB_HOST=db
      - PDL_DB_NAME=pdl3
      - PDL_DB_USER=pdl_user
      - PDL_DB_PASS=pdl_password
    networks:
      - powerdownload_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: powerdownload_db
    ports:
      - "3319:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pdl3
      MYSQL_USER: pdl_user
      MYSQL_PASSWORD: pdl_password
    volumes:
      - powerdownload_mysql_data:/var/lib/mysql
      # Schema und Grunddaten (dieselbe Datei wie für den Web-Installer)
      - ../pdl-inc/pdl3_schema.sql:/docker-entrypoint-initdb.d/01-pdl3-schema.sql:ro
      # Nur Entwicklung: Admin admin / admin123 und Installationszeitpunkt
      - ./initdb/02-dev-admin.sql:/docker-entrypoint-initdb.d/02-dev-admin.sql:ro
    networks:
      - powerdownload_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: powerdownload_phpmyadmin
    ports:
      - "8094:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - powerdownload_network
    restart: unless-stopped

networks:
  powerdownload_network:
    driver: bridge

volumes:
  powerdownload_mysql_data:
