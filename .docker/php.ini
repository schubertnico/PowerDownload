; PHP 8.4 Configuration for PowerDownload
; Error handling
; Exclude E_DEPRECATED to suppress warnings from vendor packages (PHPMD, PDepend)
; that haven't been updated for PHP 8.4 yet
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/www/html/logs/php-error.log

; Security settings
expose_php = Off
session.cookie_httponly = On
session.cookie_secure = On
session.cookie_samesite = Strict
session.use_strict_mode = On

; Disable dangerous functions (proc_open needed for Composer)
disable_functions = passthru,shell_exec,show_source

; Short open tags (disabled for security/compatibility)
short_open_tag = Off

; Upload settings
upload_max_filesize = 50M
post_max_size = 55M
max_file_uploads = 20

; Memory and execution
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; Date/Time
date.timezone = Europe/Berlin

; MySQLi settings
mysqli.default_socket = /var/run/mysqld/mysqld.sock
